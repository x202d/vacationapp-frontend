stages:
  - test
  - build

default:
  interruptible: true

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

test:
  stage: test
  image: node:22-alpine

  before_script:
    - npm ci

  script:
    - npm run lint
    - npm run format:check
    - npm run build

docker-build:
  stage: build
  image: docker:27-cli

  services:
    - name: docker:27-dind
      command:
        - "--tls=false"

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  needs:
    - job: test
      artifacts: false

  before_script:
    - docker info
    - docker login
      --username "$CI_REGISTRY_USER"
      --password "$CI_REGISTRY_PASSWORD"
      "$CI_REGISTRY"

  script:
    - docker build --pull
      --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      --tag "$CI_REGISTRY_IMAGE:latest"
      .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'