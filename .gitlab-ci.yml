stages:
  - test
  - build
  - deploy

default:
  interruptible: true

variables:
  npm_config_cache: '$CI_PROJECT_DIR/.npm'

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

test:
  stage: test
  image: node:22-alpine

  before_script:
    - npm ci

  script:
    - npm run lint
    - npm run format:check
    - npm run build

docker-build:
  stage: build

  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker
      command:
        - '--tls=false'

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''

  needs:
    - job: test
      artifacts: false

  before_script:
    - until docker info; do echo "Waiting for Docker daemon..."; sleep 2; done
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
          IMAGE_TAG="$CI_COMMIT_TAG"
      elif [ "$CI_COMMIT_BRANCH" = "dev" ]; then
          IMAGE_TAG="latest"
      else
          echo "No Docker build for this branch."
          exit 0
      fi
      
      echo "Building $CI_REGISTRY_IMAGE:$IMAGE_TAG"
      
      docker build \
        -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" \
        .
      
      docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"

  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "dev"'

deploy:
  stage: deploy

  image: alpine:latest

  needs:
    - docker-build

  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

  script:
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" '
          cd $DEPLOY_COMPOSE_FOLDER &&
          docker compose pull frontend &&
          docker compose up -d --no-deps frontend
      '

  rules:
    - if: '$CI_COMMIT_TAG'